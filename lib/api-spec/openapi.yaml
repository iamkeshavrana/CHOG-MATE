openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CHOG MATE wallet, NFT, profile, discovery, and social API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Wallet signature authentication
  - name: nft
    description: Chog Genesis ownership and metadata
  - name: profiles
    description: User profile and discovery operations
  - name: matching
    description: Likes, matches, and messaging
  - name: safety
    description: Blocking, reporting, and unmatching
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/challenge:
    post:
      operationId: createAuthChallenge
      tags: [auth]
      summary: Create a short-lived wallet sign-in challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletInput"
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthChallenge"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Check whether the current CHOG MATE session is valid
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionStatus"
  /auth/verify:
    post:
      operationId: verifyWallet
      tags: [auth]
      summary: Verify a wallet signature and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletSignatureInput"
      responses:
        "200":
          description: Wallet verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Signature is invalid or expired
  /profiles/{userId}:
    get:
      operationId: getUserProfile
      tags: [profiles]
      summary: Get a visible or socially related user's verified profile
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User profile with verified Chog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile is not available
  /auth/logout:
    post:
      operationId: logoutWallet
      tags: [auth]
      summary: End the current wallet session
      responses:
        "204":
          description: Session ended
  /nft/ownership/{walletAddress}:
    get:
      operationId: getNftOwnership
      tags: [nft]
      summary: Verify and enumerate Chog Genesis NFTs held by a wallet
      parameters:
        - name: walletAddress
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[a-fA-F0-9]{40}$"
      responses:
        "200":
          description: Ownership check completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NftOwnership"
        "503":
          description: NFT indexer is unavailable
  /nft/live-sales:
    get:
      operationId: getLiveSales
      tags: [nft]
      summary: Get a page of real Chog Genesis sales
      parameters:
        - name: next
          in: query
          required: false
          schema:
            type: string
            maxLength: 2000
      responses:
        "200":
          description: Indexed sales and the cursor for the next older page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSales"
        "503":
          description: Marketplace data is not configured
        "502":
          description: Marketplace data is unavailable
  /nft/collection-stats:
    get:
      operationId: getCollectionStats
      tags: [nft]
      summary: Get verified Chog Genesis collection statistics
      responses:
        "200":
          description: Current collection statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionStats"
        "503":
          description: Marketplace data is not configured
        "502":
          description: Marketplace data is unavailable
  /nft/tokens/{tokenId}:
    get:
      operationId: getChog
      tags: [nft]
      summary: Get verified Chog Genesis metadata
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chog metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chog"
        "404":
          description: Token does not exist or metadata is unavailable
  /me:
    get:
      operationId: getMe
      tags: [profiles]
      summary: Get the signed-in user's profile and verified Chog
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentProfile"
        "401":
          description: Wallet session required
        "503":
          description: Profile or database service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /me/profile:
    put:
      operationId: updateMeProfile
      tags: [profiles]
      summary: Create or update editable profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "409":
          description: Username is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Profile or database service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /me/discover-visibility:
    put:
      operationId: updateDiscoverVisibility
      tags: [profiles]
      summary: Update whether the signed-in user's profile appears in Discover
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverVisibilityInput"
      responses:
        "200":
          description: Discover visibility updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverVisibility"
        "409":
          description: Create a profile or complete required Discover details before enabling visibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Profile or database service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /me/chog:
    patch:
      operationId: selectActiveChog
      tags: [profiles]
      summary: Set the active Chog without changing profile details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChogSelectionInput"
      responses:
        "204":
          description: Active Chog changed
        "400":
          description: Invalid token ID
        "401":
          description: Wallet session required
        "403":
          description: Token is not currently owned by this wallet
        "409":
          description: Create a profile before setting an active Chog
        "503":
          description: Ownership check or profile storage is unavailable
  /discover:
    get:
      operationId: discoverProfiles
      tags: [profiles]
      summary: Publicly browse a page of visible verified Chog holders
      description: Authentication is optional; only signed-in profiles with a complete verified Chog identity receive compatibility ranking. Age is optional, and the active verified Chog artwork is the profile image.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [discover, date, friends, network, collab, gaming, startup, creative, hackathon, other]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 12
        - name: search
          in: query
          description: Search visible profiles by name, username, bio, interests, hobbies, languages, looking-for preferences, or active Chog token ID
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: gender
          in: query
          schema:
            type: string
            enum: [Male, Female, Gay, Trans, Alien]
        - name: minAge
          in: query
          schema:
            type: integer
            minimum: 18
            maximum: 120
        - name: maxAge
          in: query
          schema:
            type: integer
            minimum: 18
            maximum: 120
        - name: location
          in: query
          description: Match the profile's location or timezone
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: interests
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: hobbies
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: languages
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: chogTier
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: recentlyActive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Discoverable profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryPage"
        "503":
          description: Profile data or ownership checks are temporarily unavailable
  /swipes:
    post:
      operationId: swipeProfile
      tags: [matching]
      summary: Pass, like, or super-like a discoverable profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwipeInput"
      responses:
        "200":
          description: Swipe recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwipeResult"
  /likes/inbox:
    get:
      operationId: getLikeInbox
      tags: [matching]
      summary: List incoming likes and paid Super Likes
      responses:
        "200":
          description: Incoming likes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LikeInboxItem"
  /likes/sent:
    get:
      operationId: getSentLikes
      tags: [matching]
      summary: List the signed-in user's outgoing Likes and Super Likes that have not become Matches
      responses:
        "200":
          description: Outgoing pending likes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LikeInboxItem"
  /likes/sent/{targetUserId}:
    delete:
      operationId: unlikeProfile
      tags: [matching]
      summary: Revoke the signed-in user's pending Like for one profile
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Outgoing Like revoked
        "409":
          description: The users are already or previously matched
  /matches:
    get:
      operationId: getMatches
      tags: [matching]
      summary: List the signed-in user's real mutual matches
      responses:
        "200":
          description: Match list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
  /matches/ex:
    get:
      operationId: getExMatches
      tags: [matching]
      summary: List matches personally unmatched by the signed-in user
      responses:
        "200":
          description: Ex Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
  /matches/{matchId}/rematch:
    post:
      operationId: rematchProfile
      tags: [matching]
      summary: Restore a match previously ended by the signed-in user
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Match restored
        "403":
          description: The signed-in user did not end this match
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "404":
          description: The match is not available to the signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "409":
          description: The match is already active, blocked, or no longer eligible
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
        "503":
          description: Match data is temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
  /conversations:
    get:
      operationId: getConversations
      tags: [matching]
      summary: List unblocked conversations, including unmatched chat history
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
  /matches/{matchId}/messages:
    get:
      operationId: getMessages
      tags: [matching]
      summary: List messages for a match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [matching]
      summary: Send a message within a real match
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /matches/{matchId}/attachments/upload-url:
    post:
      operationId: requestMessageAttachmentUploadUrl
      tags: [matching]
      summary: Request a one-time upload token for a private chat attachment
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageAttachmentUploadInput"
      responses:
        "200":
          description: One-time upload token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageAttachmentUpload"
  /calls:
    post:
      operationId: createCall
      tags: [matching]
      summary: Start a peer-to-peer call with an active match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Call started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
  /calls/incoming:
    get:
      operationId: getIncomingCalls
      tags: [matching]
      summary: List calls ringing the signed-in user
      responses:
        "200":
          description: Incoming calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncomingCall"
  /calls/{callId}:
    get:
      operationId: getCall
      tags: [matching]
      summary: Get the state of a call the signed-in user participates in
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Call state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
  /calls/{callId}/action:
    post:
      operationId: callAction
      tags: [matching]
      summary: Accept, decline, connect, end, or fail a call
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallActionInput"
      responses:
        "200":
          description: Updated call state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSession"
  /calls/{callId}/heartbeat:
    post:
      operationId: callHeartbeat
      tags: [matching]
      summary: Keep an active call session alive
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Call heartbeat recorded
  /calls/{callId}/signals/{afterId}:
    get:
      operationId: pollCallSignals
      tags: [matching]
      summary: Poll for private WebRTC signaling messages from the other caller
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: afterId
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: New signaling messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CallSignal"
  /calls/{callId}/signals:
    post:
      operationId: sendCallSignal
      tags: [matching]
      summary: Send a private WebRTC offer, answer, or ICE candidate
      parameters:
        - name: callId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallSignalInput"
      responses:
        "201":
          description: Signaling message recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallSignal"
  /blocks:
    get:
      operationId: getBlockedUsers
      tags: [safety]
      summary: List users blocked by the signed-in account
      responses:
        "200":
          description: Blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"
    post:
      operationId: blockProfile
      tags: [safety]
      summary: Block a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "204":
          description: Profile blocked
  /blocks/{blockedUserId}:
    delete:
      operationId: unblockUser
      tags: [safety]
      summary: Unblock a user
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User unblocked
  /reports:
    post:
      operationId: reportProfile
      tags: [safety]
      summary: Report a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "204":
          description: Report recorded
  /matches/{matchId}:
    delete:
      operationId: unmatchProfile
      tags: [safety]
      summary: Unmatch and remove the active connection
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Match removed
components:
  schemas:
    ApiErrorResponse:
      type: object
      required: [code, error]
      properties:
        code: { type: string }
        error: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WalletInput:
      type: object
      required: [walletAddress]
      properties:
        walletAddress:
          type: string
          pattern: "^0x[a-fA-F0-9]{40}$"
    AuthChallenge:
      type: object
      required: [walletAddress, nonce, message, expiresAt]
      properties:
        walletAddress: { type: string }
        nonce: { type: string }
        message: { type: string }
        expiresAt: { type: string, format: date-time }
    AuthSessionStatus:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
    WalletSignatureInput:
      type: object
      required: [walletAddress, nonce, signature]
      properties:
        walletAddress: { type: string, pattern: "^0x[a-fA-F0-9]{40}$" }
        nonce: { type: string, minLength: 16 }
        signature: { type: string, pattern: "^0x[a-fA-F0-9]{130}$" }
    SessionUser:
      type: object
      required: [userId, walletAddress, hasChog, identityMode, accessToken, refreshToken, expiresIn]
      properties:
        userId: { type: string, format: uuid }
        walletAddress: { type: string }
        hasChog: { type: boolean }
        identityMode: { type: string, enum: [wallet_connected, address_only] }
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, minimum: 1 }
    NftOwnership:
      type: object
      required: [walletAddress, verified, chogs]
      properties:
        walletAddress: { type: string }
        verified: { type: boolean }
        chogs:
          type: array
          items: { $ref: "#/components/schemas/Chog" }
    PriceMetric:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string }
        currency: { type: string }
    LiveSale:
      type: object
      required: [tokenId, imageUrl, price, currency, marketplace, saleUrl, timestamp]
      properties:
        tokenId: { type: string }
        imageUrl: { type: string, format: uri }
        price: { type: string }
        currency: { type: string }
        marketplace: { type: ["string", "null"] }
        saleUrl: { type: string, format: uri }
        timestamp: { type: string, format: date-time }
    LiveSales:
      type: object
      required: [sales, next, updatedAt]
      properties:
        sales:
          type: array
          items: { $ref: "#/components/schemas/LiveSale" }
        next: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }
    CollectionStats:
      type: object
      required: [floorPrice, topOffer, totalVolume, totalHolders, updatedAt]
      properties:
        floorPrice: { oneOf: [{ $ref: "#/components/schemas/PriceMetric" }, { type: "null" }] }
        topOffer: { oneOf: [{ $ref: "#/components/schemas/PriceMetric" }, { type: "null" }] }
        totalVolume: { oneOf: [{ $ref: "#/components/schemas/PriceMetric" }, { type: "null" }] }
        totalHolders: { type: ["integer", "null"], minimum: 0 }
        updatedAt: { type: string, format: date-time }
    Chog:
      type: object
      required: [tokenId, contractAddress, ownerWallet, verified, description, tier]
      properties:
        tokenId: { type: string }
        contractAddress: { type: string }
        ownerWallet: { type: string }
        verified: { type: boolean }
        name: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], format: uri }
        imageUrls:
          type: array
          items: { type: string, format: uri }
        metadataUrl: { type: ["string", "null"], format: uri }
        traits:
          type: array
          items: { $ref: "#/components/schemas/Trait" }
    Trait:
      type: object
      required: [traitType, traitValue]
      properties:
        traitType: { type: string }
        traitValue: { type: string }
        rarity: { type: ["number", "null"], minimum: 0, maximum: 100 }
    Profile:
      type: object
      required: [userId, username, displayName, gender, age, walletAddress, walletVerified, bio, chog, interests, hobbies, languages, lookingFor, lookingForOther]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        gender: { type: ["string", "null"], enum: [Male, Female, Gay, Trans, Alien, null] }
        age: { type: ["integer", "null"], minimum: 18, maximum: 120 }
        walletAddress: { type: string }
        walletVerified: { type: boolean }
        bio: { type: ["string", "null"] }
        interests:
          type: array
          items: { type: string }
        hobbies:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        lookingFor:
          type: array
          items: { type: string, enum: [Dating, Friendship, Networking, Collaboration, Other] }
        lookingForOther: { type: ["string", "null"], maxLength: 200 }
        chog: { $ref: "#/components/schemas/Chog" }
